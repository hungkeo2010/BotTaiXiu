<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuanHung88 - Tài Xỉu MD5 🎁</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Khung bàn cược chính */
        .table-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 320px;
            background: linear-gradient(135deg, #8b0000, #4a0000);
            border: 4px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,215,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
        }

        /* Header Cóc Vàng & Tiêu đề MD5 */
        .header-title {
            text-align: center;
            position: relative;
            margin-top: -30px;
        }
        .header-title img { width: 70px; height: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .title-text {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .session-id { font-size: 11px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px; color: #ffd700; border: 1px solid #ffd700; }

        /* Vùng trung tâm: Đồng hồ đếm ngược & 2 Cửa Tài Xỉu */
        .game-area {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            position: relative;
        }

        .bet-box {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .bet-box h2 { font-size: 26px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .bet-box.tai h2 { color: #fff; }
        .bet-box.xiu h2 { color: #ddd; }
        .bet-amount { font-size: 13px; color: #ffd700; margin: 5px 0; font-weight: bold; }
        
        .btn-cuoc {
            background: linear-gradient(to bottom, #ff4500, #b22222);
            color: white;
            border: 2px solid #ffd700;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-cuoc:active { transform: scale(0.95); }

        /* Đồng hồ chính giữa */
        .timer-circle {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #fff, #e0e0e0);
            border: 4px solid #ffd700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(255,215,0,0.8);
            margin: 0 10px;
            z-index: 2;
        }

        /* Thanh lịch sử soi cầu hạt tròn phía dưới */
        .history-bar {
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.4);
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #fff;
        }
        .dot.tai { background: #fff; box-shadow: 0 0 5px #fff; }
        .dot.xiu { background: #333; box-shadow: 0 0 5px #000; }

        /* Các nút chức năng xung quanh bàn */
        .icon-btn {
            position: absolute;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            color: #000;
            font-weight: bold;
        }
        .btn-help { top: 10px; left: 10px; }
        .btn-stats { top: 60px; left: 10px; }
        .btn-history { bottom: 10px; left: 10px; }
        .btn-close { top: 10px; right: 10px; }
        .btn-chat { bottom: 10px; right: 60px; }
        .btn-nan { bottom: 10px; right: 10px; background: linear-gradient(135deg, #00ffcc, #0088cc); color: #fff; }

        /* Khung Nặn Xúc Xắc (Popup khi hết giờ) */
        #nan-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .bowl {
            width: 180px; height: 180px;
            background: radial-gradient(circle, #c0392b, #78281f);
            border: 6px solid #f39c12;
            border-radius: 50%;
            cursor: grab;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; color: #f1c40f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            touch-action: none;
            transition: transform 0.1s ease;
        }
        .dice-container {
            display: flex; gap: 15px; margin-bottom: 25px;
        }
        .dice {
            width: 50px; height: 50px; background: #fff; color: #000;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; box-shadow: 0 4px 10px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="table-container">
        <!-- Nút chức năng góc -->
        <div class="icon-btn btn-help" onclick="alert('Luật chơi: Đặt Tài hoặc Xỉu. Hết giờ bấm bàn tay để nặn xúc xắc!')">?</div>
        <div class="icon-btn btn-stats" onclick="alert('Bảng xếp hạng đại gia TuanHung88')">🏆</div>
        <div class="icon-btn btn-close" onclick="Telegram.WebApp.close()">✕</div>
        <div class="icon-btn btn-history" onclick="alert('Lịch sử cược cá nhân')">📜</div>
        <div class="icon-btn btn-chat" onclick="alert('Khung chat nhóm đang hoạt động')">💬</div>
        <div class="icon-btn btn-nan" onclick="openNanModal()">🖐️</div>

        <!-- Header -->
        <div class="header-title">
            <div class="title-text">Tài Xỉu MD5</div>
            <div class="session-id" id="session-id">#543170</div>
        </div>

        <!-- Bàn cược trung tâm -->
        <div class="game-area">
            <div class="bet-box tai">
                <h2>TÀI</h2>
                <div class="bet-amount" id="tai-sum">82,556</div>
                <button class="btn-cuoc" onclick="datCuoc('tai')">CƯỢC</button>
            </div>

            <div class="timer-circle" id="timer">46</div>

            <div class="bet-box xiu">
                <h2>XỈU</h2>
                <div class="bet-amount" id="xiu-sum">156,590</div>
                <button class="btn-cuoc" onclick="datCuoc('xiu')">CƯỢC</button>
            </div>
        </div>

        <!-- Lịch sử soi cầu hạt -->
        <div class="history-bar">
            <span class="dot tai"></span>
            <span class="dot xiu"></span>
            <span class="dot xiu"></span>
            <span class="dot tai"></span>
            <span class="dot tai"></span>
            <span class="dot xiu"></span>
            <span class="dot tai"></span>
            <span class="dot xiu"></span>
        </div>
    </div>

    <!-- Màn hình Nặn Xúc Xắc -->
    <div id="nan-modal">
        <h3 style="margin-bottom: 20px; color: #ffd700;">🎲 KÉO BÁT ĐỂ NẶN XÚC XẮC 🎲</h3>
        <div class="dice-container" id="dice-result">
            <div class="dice" id="d1">4</div>
            <div class="dice" id="d2">5</div>
            <div class="dice" id="d3">6</div>
        </div>
        <div class="bowl" id="bowl" ontouchstart="startDrag(event)" onmousedown="startDrag(event)">
            Vuốt để mở bát
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mở full màn hình Mini App trên Telegram

        // Đồng hồ đếm ngược giả lập
        let timeLeft = 46;
        setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) timeLeft = 50;
            document.getElementById('timer').innerText = timeLeft;
        }, 1000);

        function datCuoc(Cua) {
            tg.HapticFeedback.impactOccurred('medium');
            alert('Đã đặt cược thành công vào cửa: ' + Cua.toUpperCase());
        }

        function openNanModal() {
            document.getElementById('nan-modal').style.display = 'flex';
        }

        // Hiệu ứng kéo bát nặn xúc xắc
        let bowl = document.getElementById('bowl');
        let startX = 0, startY = 0, isDragging = false;

        function startDrag(e) {
            isDragging = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('touchmove', onDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function onDrag(e) {
            if (!isDragging) return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let diffX = clientX - startX;
            let diffY = clientY - startY;

            bowl.style.transform = `translate(${diffX}px, ${diffY}px)`;

            // Nếu kéo dịch ra xa, tự động ẩn bát để lộ xúc xắc
            if (Math.abs(diffX) > 100 || Math.abs(diffY) > 100) {
                tg.HapticFeedback.notificationOccurred('success');
                bowl.style.display = 'none';
                isDragging = false;
            }
        }

        function endDrag() {
            isDragging = false;
        }
    </script>
</body>
</html>
